name: Build GUI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is based on master
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/master" || {
            echo "The release tag must point to a commit contained in master."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KorailReservationGui gui_main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/KorailReservationGui.exe
